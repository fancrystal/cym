plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingProps = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'green.cym.app'
    compileSdk 34
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'green.cym.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
}
